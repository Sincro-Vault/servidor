syntax = "proto3";

package sincrovault;

// Servicio principal para gestión distribuida de fragmentos de secretos.
// El backend cliente (.NET) llama a estos métodos por gRPC + TLS 1.3.
service SecretsServer {
  // Autenticación: valida usuario+contraseña+certificado RSA, devuelve JWT.
  rpc Login(LoginRequest) returns (LoginResponse);

  // Registro de un nuevo usuario en el servidor.
  rpc Register(RegisterRequest) returns (RegisterResponse);

  // Almacenar el fragmento B (F2) de un secreto.
  rpc StoreFragment(StoreFragmentRequest) returns (StoreFragmentResponse);

  // Recuperar el fragmento B de un secreto. Requiere validación geográfica
  // pasada desde el cliente (latitud, longitud, IP).
  rpc GetFragment(GetFragmentRequest) returns (GetFragmentResponse);

  // Eliminar el fragmento B de un secreto.
  rpc DeleteFragment(DeleteFragmentRequest) returns (DeleteFragmentResponse);

  // Listar IDs de secretos que tienen fragmento en este servidor (para el usuario).
  rpc ListFragments(ListFragmentsRequest) returns (ListFragmentsResponse);

  // Heartbeat para verificar conectividad.
  rpc Heartbeat(HeartbeatRequest) returns (HeartbeatResponse);
}

// === Mensajes de autenticación ===

message LoginRequest {
  string username = 1;
  string password = 2;
  bytes rsa_public_key_pem = 3; // PEM del certificado RSA del cliente
}

message LoginResponse {
  string access_token = 1;
  int32 expires_in_seconds = 2;
  string user_id = 3;
}

message RegisterRequest {
  string username = 1;
  string password = 2;
  string email = 3;
  bytes rsa_public_key_pem = 4;
}

message RegisterResponse {
  string user_id = 1;
  string username = 2;
}

// === Mensajes de fragmentos ===

message StoreFragmentRequest {
  string jwt_token = 1;
  string secret_id = 2;
  int32 fragment_index = 3;
  bytes encrypted_fragment = 4;
  string checksum = 5;
  GeoContext geo_context = 6;
}

message StoreFragmentResponse {
  bool success = 1;
  string fragment_id = 2;
  string ledger_block_hash = 3; // hash del bloque blockchain que registró la op
}

message GetFragmentRequest {
  string jwt_token = 1;
  string secret_id = 2;
  GeoContext geo_context = 3;
}

message GetFragmentResponse {
  bool success = 1;
  int32 fragment_index = 2;
  bytes encrypted_fragment = 3;
  string checksum = 4;
  string ledger_block_hash = 5;
  string deny_reason = 6; // si success=false, motivo del bloqueo (ej: ubicación)
}

message DeleteFragmentRequest {
  string jwt_token = 1;
  string secret_id = 2;
}

message DeleteFragmentResponse {
  bool success = 1;
  string ledger_block_hash = 2;
}

message ListFragmentsRequest {
  string jwt_token = 1;
}

message ListFragmentsResponse {
  repeated string secret_ids = 1;
}

message HeartbeatRequest {
  string client_id = 1;
}

message HeartbeatResponse {
  string status = 1;
  int64 server_time_unix = 2;
}

// === Contexto geográfico (usado para auditoría) ===

message GeoContext {
  double latitude = 1;
  double longitude = 2;
  string ip_address = 3;
  double accuracy_meters = 4;
}
